<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11101f"/>
      <stop offset="0.55" stop-color="#1c1740"/>
      <stop offset="1" stop-color="#27205a"/>
    </linearGradient>
    <radialGradient id="leftGlow">
      <stop offset="0" stop-color="#6f63ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6f63ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow">
      <stop offset="0" stop-color="#70e8b6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#70e8b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="660" height="400" rx="20" fill="url(#background)"/>
  <circle cx="165" cy="220" r="125" fill="url(#leftGlow)"/>
  <circle cx="495" cy="220" r="125" fill="url(#rightGlow)"/>

  <g opacity="0.45" fill="#8b82ff">
    <rect x="26" y="27" width="4" height="4"/>
    <rect x="55" y="76" width="3" height="3"/>
    <rect x="608" y="35" width="4" height="4"/>
    <rect x="625" y="92" width="3" height="3"/>
    <rect x="33" y="286" width="3" height="3"/>
    <rect x="615" y="278" width="4" height="4"/>
  </g>

  <g transform="translate(36 31)" shape-rendering="crispEdges">
    <rect x="8" y="0" width="5" height="5" fill="#8178ff"/>
    <rect x="23" y="0" width="5" height="5" fill="#8178ff"/>
    <rect x="5" y="5" width="26" height="5" rx="1" fill="#8178ff"/>
    <rect x="0" y="10" width="36" height="18" rx="6" fill="#8178ff"/>
    <rect x="9" y="15" width="5" height="5" fill="#27205a"/>
    <rect x="22" y="15" width="5" height="5" fill="#27205a"/>
    <rect x="7" y="22" width="5" height="5" fill="#70e8b6"/>
    <rect x="24" y="22" width="5" height="5" fill="#70e8b6"/>
  </g>

  <text x="330" y="54" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Install QuotaCreature</text>
  <text x="330" y="82" fill="#bcb8d8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" text-anchor="middle">Drag QuotaCreature to Applications</text>

  <g fill="none" stroke="#70e8b6" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" filter="url(#softShadow)" opacity="0.32">
    <path d="M270 220 H385 M361 196 L385 220 L361 244"/>
  </g>
  <g fill="none" stroke="#70e8b6" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M270 220 H385 M361 196 L385 220 L361 244"/>
  </g>

  <rect x="66" y="329" width="528" height="47" rx="14" fill="#0b0a15" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.08"/>
  <text x="330" y="350" fill="#e7e5f5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle">First launch: Control-click QuotaCreature → Open</text>
  <text x="330" y="367" fill="#9a96b6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" text-anchor="middle">Beta · ad-hoc signed · not Apple-notarized</text>
</svg>
